<!-- templates/emails/auth/otp.html -->

<!doctype html>
<html>
  <body style="margin:0;padding:32px;font-family:Arial,sans-serif;background:#f9fafb;">
    <table width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;">
      <tr>
        <td style="padding:24px;">
          <h1 style="margin:0 0 12px;font-size:22px;color:#111827;">
            {{ title }}
          </h1>

          <p style="font-size:15px;line-height:22px;color:#374151;">
            {{ lead }}
          </p>

          <div style="margin:24px 0;text-align:center;">
            <span style="display:inline-block;font-size:30px;font-weight:700;letter-spacing:6px;padding:14px 20px;border:1px dashed #111827;border-radius:10px;color:#111827;">
              {{ code }}
            </span>
          </div>

          <p style="font-size:14px;line-height:20px;color:#374151;">
            This code expires in <strong>{{ ttl_minutes }} minutes</strong>.
          </p>

          <p style="font-size:12px;line-height:18px;color:#6b7280;">
            If you did not request this, you can safely ignore this email.
          </p>

          <p style="margin-top:24px;font-size:12px;color:#9ca3af;">
            {{ brand_name }}
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
