<div style="font-family:Arial,sans-serif;background:#f8fafc;padding:32px 16px;color:#111827;">
  <div style="max-width:640px;margin:0 auto;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;padding:32px;">
    <h1 style="margin:0 0 12px;font-size:24px;">Subscription active</h1>

    <p style="font-size:15px;line-height:1.7;color:#374151;">

    </p>

    </p>

    <p style="margin-top:24px;font-size:13px;color:#6b7280;">

    </p>

</div>
