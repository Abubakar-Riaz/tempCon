<div style="font-family:Arial,sans-serif;background:#f8fafc;padding:32px 16px;color:#111827;">
  <div style="max-width:640px;margin:0 auto;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;padding:32px;">
    <h1 style="margin:0 0 12px;font-size:24px;">Payment failed</h1>

    <p style="font-size:15px;line-height:1.7;color:#374151;">
      We could not process a payment for <strong>{{ company.name }}</strong>.
    </p>

    <p style="font-size:15px;line-height:1.7;color:#374151;">
      Amount due:
      <strong>{{ invoice.currency }} {{ invoice.amount_remaining|default:invoice.total }}</strong>
    </p>

    {% if invoice.provider_hosted_invoice_url %}
      <p style="margin:24px 0;">
        <a href="{{ invoice.provider_hosted_invoice_url }}" style="display:inline-block;padding:12px 18px;background:#111827;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:600;">
          View invoice
        </a>
      </p>
    {% endif %}

    <p style="margin-top:24px;font-size:13px;color:#6b7280;">
      — {{ brand_name }}
    </p>
  </div>
</div>
