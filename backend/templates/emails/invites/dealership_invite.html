<!-- templates/emails/invites/dealership_invite.html -->

<!doctype html>
<html>
  <body style="margin:0;padding:32px;font-family:Arial,sans-serif;background:#f9fafb;">
    <table width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;">
      <tr>
        <td style="padding:24px;">
          <h1 style="margin:0 0 12px;font-size:22px;color:#111827;">
            You’ve been invited to {{ company.name }}
          </h1>

          <p style="font-size:15px;line-height:22px;color:#374151;">
            You were invited to join <strong>{{ dealership.name }}</strong> as <strong>{{ role }}</strong>.
          </p>

          <p style="margin:24px 0;">
            <a href="{{ accept_url }}" style="display:inline-block;background:#111827;color:#ffffff;text-decoration:none;padding:12px 18px;border-radius:8px;">
              Accept invite
            </a>
          </p>

          {% if expires_at %}
            <p style="font-size:14px;line-height:20px;color:#6b7280;">
              This invite expires on {{ expires_at }}.
            </p>
          {% endif %}

          <p style="font-size:12px;line-height:18px;color:#6b7280;">
            If you were not expecting this invite, you can ignore this email.
          </p>

          <p style="margin-top:24px;font-size:12px;color:#9ca3af;">
            {{ brand_name }}
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
